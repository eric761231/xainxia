# ============================================================================
#  創角設定檔  char_create.ini
# ----------------------------------------------------------------------------
#  讀取者：com.xin.server.config.CharCreateConfig（透過 java.util.Properties）
#  載入順序：優先 classpath /config/char_create.ini，找不到才退外部檔 config/char_create.ini
#  生效時機：伺服器啟動時載入；修改後需「重啟伺服器」或呼叫 CharCreateConfig.reload()
#  套用對象：僅影響「新建立」的角色（C_CreateCharacter 用這些值寫入 DB）；
#           既有角色的數值/出生點已存於 DB，改此檔不會變動他們。
#
#  格式規則（java.util.Properties）：
#    - 每行一組 key=value；鍵值大小寫敏感，數值一律為「整數」。
#    - 註解自成一行，以 # 或 ; 開頭；不支援行尾註解（例如 key=1 # 說明 會把 "1 # 說明" 當成值）。
#    - 缺少某欄位時，程式自動使用「內建預設值」（下方每欄括號中的數字）。
# ============================================================================

# ─────────────────────────────────────────────────────────────────────────
#  一、戰鬥基底值（角色初始戰力，創角時寫入角色）
# ─────────────────────────────────────────────────────────────────────────

# 初始氣血上限（HP）(預設 100)
baseHp=100

# 初始靈力上限（MP）(預設 50)
baseMp=50

# 初始防禦力（減傷）(預設 5)
baseDefense=5

# 初始攻擊力（基礎傷害）(預設 5)
baseAttack=5

# 初始命中值（影響是否打中）(預設 10)
baseHit=10

# 初始閃避值（影響是否被打中）(預設 5)
baseDodge=5

# 每回合氣血自然回復量 (預設 1)
baseHpRegen=1

# 每回合靈力自然回復量 (預設 1)
baseMpRegen=1

# 初始傀儡欄位數（可同時操控的傀儡數）(預設 0)
basePuppetSlot=0

# 傀儡欄位上限（成長後最多可開到幾格）(預設 4)
maxPuppet=4

# 學習法術成功率，單位 %（100=必定學會）(預設 100)
baseSpellLearnRate=100

# 仙藝（生產技藝）熟練提升效率，單位 %(預設 100)
baseCraftProficiencyRate=100

# ─────────────────────────────────────────────────────────────────────────
#  二、創角配點規則（四維素質分配與出生點）
# ─────────────────────────────────────────────────────────────────────────

# 四維素質（悟性 / 神識 / 敏捷 / 體魄）「每一項」的初始基底值，
# 即創角時每項最低保證值 (預設 10)
baseStatPerAttr=10

# 創角可自由分配的總點數，玩家在四維素質間任意加點 (預設 8)
bonusPool=8

# 新角色出生地圖編號（對應 DB map 表；0=梅花村）(預設 0)
defaultMapId=0

# 新角色出生 X 格座標（tile 座標，須在該地圖邊界內）(預設 0)
# 對齊 map.sql（可走 1..50）：地圖中心 (25,25) 為出生點。
defaultX=25

# 新角色出生 Y 格座標（tile 座標，須在該地圖邊界內）(預設 0)
defaultY=25
